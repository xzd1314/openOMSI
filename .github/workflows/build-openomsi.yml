name: Build openomsi
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build game
        shell: pwsh
        run: cargo build --release -p omsi-app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openomsi-patched
          path: target/release/openomsi.exe
          if-no-files-found: error